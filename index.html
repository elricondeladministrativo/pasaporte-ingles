<style>
/* Layout: a passport. Home = page of 12 visa slots (one per File); play = one card at a time; result = the stamp lands. */
:root{
  --paper:#edf1f4; --page:#ffffff; --ink:#14233a; --muted:#5a6679; --line:#d3dbe4;
  --stamp:#a8235f; --ok:#17734a; --ok-bg:#e3f4ea; --bad:#b8352a; --bad-bg:#fbe8e5;
  --u1:#7a2a8c; --u2:#0f7a45; --u3:#c0262a; --u4:#1460b8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1623; --page:#162133; --ink:#e7edf5; --muted:#98a5b8; --line:#2a3850;
  --stamp:#f2729f; --ok:#57c991; --ok-bg:#15372a; --bad:#ff8273; --bad-bg:#3d1d1c;
  --u1:#c784dc; --u2:#53c98d; --u3:#ff7473; --u4:#6aacff; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1623; --page:#162133; --ink:#e7edf5; --muted:#98a5b8; --line:#2a3850;
  --stamp:#f2729f; --ok:#57c991; --ok-bg:#15372a; --bad:#ff8273; --bad-bg:#3d1d1c;
  --u1:#c784dc; --u2:#53c98d; --u3:#ff7473; --u4:#6aacff; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  background-image:
    repeating-radial-gradient(circle at 100% 0, transparent 0 22px, color-mix(in srgb, var(--line) 45%, transparent) 22px 23px),
    repeating-radial-gradient(circle at 0 100%, transparent 0 30px, color-mix(in srgb, var(--line) 35%, transparent) 30px 31px);
  background-attachment:fixed;
}
#app{max-width:760px; margin:0 auto; padding-block:20px 48px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible{outline:3px solid var(--stamp); outline-offset:2px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0}
.label{font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* ---------- Home ---------- */
.cover{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; padding-bottom:18px; border-bottom:2px solid var(--ink)}
.cover h1{font-size:clamp(34px, 7vw, 54px); font-weight:800; line-height:.95; letter-spacing:-.02em}
.cover h1 span{color:var(--stamp)}
.cover p{margin:8px 0 0; color:var(--muted); max-width:42ch}
.tally{text-align:right}
.tally b{font-family:var(--display); font-size:34px; line-height:1}
.toolbar{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); background:var(--page); border-radius:999px; padding:6px 14px; font-size:14px; display:inline-flex; gap:6px; align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.voicepanel{margin-top:12px; background:var(--page); border:1.5px solid var(--line); border-radius:8px; padding:14px; display:grid; gap:8px; max-width:520px}
.voicepanel select{font:inherit; font-size:16px; padding:10px; border:1.5px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); width:100%; min-width:0}
.voicepanel input[type=range]{width:100%; accent-color:var(--stamp)}
.vp-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:4px}
.vp-help{font-size:13px; color:var(--muted); flex:1 1 200px}
.grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-top:22px}
@media (max-width:620px){ .grid{grid-template-columns:repeat(2, minmax(0,1fr))} }
.visa{
  position:relative; text-align:left; background:var(--page); border:1.5px dashed var(--line); border-radius:6px;
  padding:14px 14px 12px; min-height:150px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
  transition:transform .15s ease, border-color .15s ease;
}
.visa:hover{transform:translateY(-2px); border-color:var(--c)}
.visa .num{font-family:var(--mono); font-weight:700; font-size:13px; color:var(--c); letter-spacing:.08em}
.visa h3{font-size:17px; line-height:1.15; font-weight:700}
.visa small{color:var(--muted); font-size:13px; line-height:1.35}
.visa .stars{margin-top:auto; font-size:15px; letter-spacing:2px; color:var(--line)}
.visa .stars i{font-style:normal}
.visa .stars i.on{color:var(--c)}
.visa .ink{
  position:absolute; right:-6px; bottom:16px; transform:rotate(-14deg);
  border:3px double var(--c); color:var(--c); border-radius:8px; padding:2px 8px;
  font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.1em; opacity:.85; background:var(--page);
}
.extras{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:12px}
@media (max-width:620px){ .extras{grid-template-columns:1fr} }
.extra{background:var(--ink); color:var(--page); border:0; border-radius:6px; padding:16px; text-align:left; display:flex; flex-direction:column; gap:2px}
.extra b{font-family:var(--display); font-size:20px}
.extra span{opacity:.75; font-size:14px}
.foot{margin-top:22px; color:var(--muted); font-size:13px}

/* ---------- Play ---------- */
.bar{display:flex; align-items:center; gap:12px}
.icon-btn{background:var(--page); border:1.5px solid var(--line); border-radius:999px; width:40px; height:40px; display:grid; place-items:center; flex:none}
.icon-btn svg{width:20px; height:20px}
.track{flex:1; height:10px; background:var(--line); border-radius:999px; overflow:hidden}
.track div{height:100%; background:var(--c, var(--stamp)); width:0; transition:width .3s ease}
.streak{font-family:var(--mono); font-weight:700; font-size:14px; min-width:44px; text-align:right}
.card{margin-top:18px; background:var(--page); border-radius:10px; padding:22px; border-top:6px solid var(--c, var(--stamp)); box-shadow:0 1px 0 var(--line)}
.kind{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.prompt{font-family:var(--display); font-weight:700; font-size:clamp(22px, 4.6vw, 30px); line-height:1.2; margin:12px 0 20px; overflow-wrap:anywhere}
.prompt .blank{display:inline-block; min-width:2.6em; border-bottom:3px solid var(--c, var(--stamp)); margin:0 .1em}
.prompt .es{display:block; font-family:var(--body); font-weight:400; font-size:15px; color:var(--muted); margin-top:6px}
.opts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
@media (max-width:520px){ .opts{grid-template-columns:1fr} }
.opt{display:flex; align-items:center; gap:10px; text-align:left; background:var(--paper); border:2px solid var(--line); border-radius:8px; padding:12px 14px; min-height:54px; overflow-wrap:anywhere}
.opt kbd{font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; flex:none}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default}
.listen{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap}
.play{display:inline-flex; align-items:center; gap:10px; background:var(--c, var(--stamp)); color:var(--page); border:0; border-radius:999px; padding:12px 20px; font-weight:700}
.play.slow{background:var(--page); color:var(--ink); border:1.5px solid var(--line)}
.play svg{width:20px; height:20px}
.slots{min-height:58px; border-bottom:2px solid var(--ink); display:flex; flex-wrap:wrap; gap:8px; padding:6px 0 10px; margin-bottom:14px}
.bank{display:flex; flex-wrap:wrap; gap:8px; min-height:48px}
.tok{background:var(--paper); border:2px solid var(--line); border-radius:6px; padding:8px 12px; font-weight:700}
.tok:hover{border-color:var(--ink)}
.tok.used{visibility:hidden}
.write{display:flex; gap:10px; flex-wrap:wrap}
.write input{flex:1 1 220px; min-width:0; font:inherit; font-size:20px; padding:12px 14px; border:2px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink)}
.go{background:var(--ink); color:var(--page); border:0; border-radius:8px; padding:12px 22px; font-weight:700}
.go:disabled{opacity:.4; cursor:default}
.actions{margin-top:16px; display:flex; justify-content:flex-end}
.fb{margin-top:18px; border-radius:8px; padding:14px 16px; display:flex; gap:14px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.fb.ok{background:var(--ok-bg); color:var(--ink)}
.fb.no{background:var(--bad-bg); color:var(--ink)}
.fb strong{display:block; font-family:var(--display); font-size:20px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--bad)}
.fb p{margin:2px 0 0}
.fb .txt{flex:1 1 260px; min-width:0}
.fb .btns{display:flex; gap:8px; align-items:center}
.retry-tag{color:var(--stamp)}

/* ---------- Result ---------- */
.result{text-align:center; padding-top:20px}
.bigstamp{
  display:inline-flex; flex-direction:column; align-items:center; gap:2px; margin:18px auto 10px;
  border:5px double var(--c, var(--stamp)); color:var(--c, var(--stamp)); border-radius:14px; padding:16px 28px;
  transform:rotate(-8deg); font-family:var(--mono); font-weight:700; letter-spacing:.14em;
  animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;
}
.bigstamp .s{font-size:34px; letter-spacing:6px}
.bigstamp .w{font-size:13px}
.bigstamp.fail{border-style:dashed; color:var(--muted); border-color:var(--muted)}
@keyframes slam{from{transform:rotate(-20deg) scale(1.8); opacity:0} to{transform:rotate(-8deg) scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){ .bigstamp{animation:none} .visa, .track div{transition:none} }
.score{font-family:var(--display); font-size:48px; font-weight:800; line-height:1; margin-top:8px}
.result p{color:var(--muted); margin:6px 0 0}
.review{text-align:left; margin-top:24px; background:var(--page); border-radius:10px; padding:16px 18px}
.review h3{font-size:18px; margin-bottom:8px}
.review li{margin:8px 0; overflow-wrap:anywhere}
.review .yours{color:var(--bad); text-decoration:line-through}
.review .good{color:var(--ok); font-weight:700}
.row{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap}
.ghost{background:var(--page); color:var(--ink); border:1.5px solid var(--line); border-radius:8px; padding:12px 22px; font-weight:700}
</style>

<div id="app"></div>

 M("Te vas y lo/la ves mañana. ¿Qué decís?","See you tomorrow.",["Nice to meet you.","Hello.","Just a minute."]),
 O("Where are you from?","¿De dónde sos?"),

 L("98",["19","89","99"],null,"ninety-eight"),

]},

 M("Where ___ my glasses?","are",["is","am","be"],"glasses (anteojos) es plural en inglés."),

 M("Una cosa, lejos de vos: «___ is my phone.»","That",["This","These","Those"],"this / these = cerca; that / those = lejos."),

 M("Mr and Mrs Lee are here. Those are ___ children.","their",["they","there","them"]),
 M("Hi! What's ___ name?","your",["you","you're","yours"]),
 M("We love this car. It's ___ car.","our",["we","us","ours"]),
 M("¿Cómo se dice «Es el auto de Ana»?","It's Ana's car.",["It's car Ana.","It's the car of Ana's.","It's Anas car."],"Persona + 's + cosa: Ana's car."),

]},

 M("___ English and Spanish","speak",["talk","say","tell"]),

/* Verbos de la página «Regular and irregular verbs» */
const REG="answer answered|arrive arrived|ask asked|book booked|carry carried|change changed|clean cleaned|close closed|cook cooked|cry cried|decide decided|finish finished|hate hated|help helped|invite invited|learn learned|like liked|listen listened|live lived|look looked|love loved|miss missed|move moved|need needed|offer offered|open opened|pack packed|paint painted|park parked|pass passed|phone phoned|play played|rain rained|relax relaxed|rent rented|snow snowed|start started|stay stayed|stop stopped|study studied|talk talked|travel travelled|turn turned|use used|wait waited|walk walked|want wanted|wash washed|watch watched|work worked".split("|").map(s=>s.split(" "));
const IRR=[["be (I / he)","was"],["be (you / we / they)","were"],["buy","bought"],["do","did"],["get","got"],["go","went"],["have","had"],["leave","left"],["say","said"],["see","saw"],["send","sent"],["sit","sat"],["tell","told"],["write","wrote"]];
const ALT={learned:["learnt"],travelled:["traveled"]};

/* ===================== Estado y utilidades ===================== */
const COLORS=["var(--u1)","var(--u2)","var(--u3)","var(--u4)"];
const colorOf=n=>COLORS[(n-1)%4];
const KEY="pasaporte-ingles-v1";
let save={stars:{},muted:false,voice:"",rate:0.9};
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) save=Object.assign(save,s);}catch(e){}
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){} }

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?¿¡,]+/g," ").replace(/\s+/g," ").trim();
const app=document.getElementById("app");

/* Voz */
const TTS="speechSynthesis" in window;
let voices=[];
const REGION={GB:"Reino Unido",US:"EE. UU.",AU:"Australia",IE:"Irlanda",CA:"Canadá",IN:"India",NZ:"Nueva Zelanda",ZA:"Sudáfrica"};
function englishVoices(){
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const rank=v=>(/GB/i.test(v.lang)?0:/US/i.test(v.lang)?1:2);
  return en.sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));
}
function voiceLabel(v){
  const reg=(v.lang.split(/[-_]/)[1]||"").toUpperCase();
  const name=v.name.replace(/\s*[-–(].*$/,"").replace(/^(Microsoft|Google|Apple)\s+/i,"").trim()||v.name;
  return `${name} · ${REGION[reg]||reg||"inglés"}`;
}
function currentVoice(){
  const en=englishVoices();
  return en.find(v=>v.voiceURI===save.voice)||en.find(v=>/GB/i.test(v.lang))||en[0]||null;
}
function loadVoices(){ if(!TTS) return; voices=speechSynthesis.getVoices(); fillVoices(); }
if(TTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text,slow=false){
  if(!TTS) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=currentVoice();
  if(v) u.voice=v; u.lang=v?v.lang:"en-GB";
  u.rate=slow?Math.max(0.5,save.rate*0.65):save.rate;
  speechSynthesis.speak(u);
}
function fillVoices(){
  const sel=document.getElementById("voice"); if(!sel) return;
  const en=englishVoices(), cur=currentVoice();
  sel.innerHTML=en.length?en.map(v=>`<option value="${esc(v.voiceURI)}"${cur&&v.voiceURI===cur.voiceURI?" selected":""}>${esc(voiceLabel(v))}</option>`).join(""):'<option value="">No hay voces en inglés en este dispositivo</option>';
  const chip=document.getElementById("voicechip-name"); if(chip) chip.textContent=cur?voiceLabel(cur).split(" · ")[0]:"sin voz";
}

/* Sonidos */
let actx=null;
function beep(ok){
  if(save.muted) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[220,180];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?"triangle":"square";o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+i*.09);
      g.gain.exponentialRampToValueAtTime(ok?.18:.06,actx.currentTime+i*.09+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.09+.16);
      o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.09);o.stop(actx.currentTime+i*.09+.18);});
  }catch(e){}
}

/* ===================== Pantalla: pasaporte ===================== */
function starsHTML(n){ let s=""; for(let i=0;i<3;i++) s+=`<i class="${i<n?"on":""}">★</i>`; return s; }
function home(){

  const total=UNITS.reduce((t,u)=>t+(save.stars[u.n]||0),0);
  const sealed=UNITS.filter(u=>(save.stars[u.n]||0)>0).length;
  app.innerHTML=`

    ${TTS?`<button class="chip" id="voicechip" aria-expanded="false" aria-controls="voicepanel">${ICON.spk.replace('<svg','<svg width="16" height="16"')} Voz: <span id="voicechip-name">…</span></button>`:'<span class="chip">Tu navegador no tiene voz: se saltean las preguntas de escuchar</span>'}
  </div>
  ${TTS?`<section class="voicepanel" id="voicepanel" hidden>
    <label class="label" for="voice">Voz en inglés</label>
    <select id="voice"></select>
    <label class="label" for="rate">Velocidad <span id="ratev"></span></label>
    <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${save.rate}">
    <div class="vp-row"><button class="go" id="trytts">Probar voz</button><span class="vp-help">¿Pocas voces? En el celular se agregan desde la configuración del teléfono (texto a voz).</span></div>
  </section>`:""}
  <section class="grid" aria-label="Files">
    ${UNITS.map(u=>{const s=save.stars[u.n]||0;return `
      <button class="visa" style="--c:${colorOf(u.n)}" data-u="${u.n}">

  </section>
  <section class="extras">

    <button class="extra" id="verbs"><b>Aduana de verbos</b><span>15 verbos en pasado, de la lista del libro</span></button>
  </section>
  <p class="foot">El progreso se guarda en este navegador.</p>`;
  app.querySelectorAll(".visa").forEach(b=>b.onclick=()=>{const u=UNITS[b.dataset.u-1];startUnit(u);});
  app.querySelector("#mix").onclick=()=>start({kind:"mix",label:"Vuelo mezclado",color:"var(--stamp)"},pickMix());
  app.querySelector("#verbs").onclick=()=>start({kind:"verbs",label:"Aduana de verbos",color:"var(--stamp)"},pickVerbs());
  app.querySelector("#mute").onclick=()=>{save.muted=!save.muted;persist();home();};
  if(TTS){
    const chip=app.querySelector("#voicechip"), panel=app.querySelector("#voicepanel"), rate=app.querySelector("#rate"), ratev=app.querySelector("#ratev");

    app.querySelector("#voice").onchange=e=>{save.voice=e.target.value; persist(); fillVoices(); speak("Hello! Nice to meet you.");};
    rate.oninput=()=>{save.rate=+rate.value; showRate(); persist();};

function usable(q){ return TTS||q.t!=="l"; }
function startUnit(u){ start({kind:"unit",unit:u,label:"FILE "+String(u.n).padStart(2,"0"),color:colorOf(u.n)}, shuffle(u.q.filter(usable)).slice(0,10)); }
function pickMix(){ return shuffle(UNITS.flatMap(u=>u.q.filter(usable).map(q=>Object.assign({from:u.n},q)))).slice(0,15); }
function pickVerbs(){
  const irr=shuffle(IRR).slice(0,9).map(([b,p])=>W(`Pasado: ${b} →`,p,"Verbo irregular: hay que aprenderlo de memoria."));
  const reg=shuffle(REG).slice(0,6).map(([b,p])=>{
    let e="Regular: se agrega -ed.";
    if(/ied$/.test(p)) e="Consonante + y → -ied.";
    else if(p===b+p.slice(-3,-2)+"ed") e="Se duplica la última consonante y se agrega -ed.";
    else if(b.endsWith("e")) e="Termina en -e: solo se agrega -d.";
    return W(`Pasado: ${b} →`,[p].concat(ALT[p]||[]),e);
  });
  return shuffle(irr.concat(reg));
}

/* ===================== Pantalla: juego ===================== */
let S=null;
function start(meta,qs){
  S={meta,queue:qs.map(q=>Object.assign({},q,{opts:q.o?shuffle([q.a].concat(q.o)):null})),i:0,ok:0,total:qs.length,streak:0,best:0,mistakes:[]};
  ask();
}

function sentenceFor(q){
  if(q.t==="o"||q.t==="l") return q.say||q.a;
  const base=q.q.replace(/\s*\([^)]*\)/g,"");
  if(/___/.test(base) && !/[áéíóúñ¿¡«]/i.test(base)) return base.replace(/^—\s*/,"").replace(/—/g,"").replace("___",q.a);
  return /[áéíóúñ¿¡]/i.test(q.a)?"":q.a;
}

function promptHTML(q){
  const parts=esc(q.q).split("___");
  return parts.length>1?parts.join('<span class="blank">&nbsp;</span>'):esc(q.q);
}

function ask(){
  const q=S.queue[S.i]; S.answered=false;
  const kinds={m:"Elegí",l:"Escuchá",o:"Ordená",w:"Escribí"};
  const fromTag=q.from?` · FILE ${String(q.from).padStart(2,"0")}`:"";
  app.style.setProperty("--c", S.meta.color);
  let body="";
  if(q.t==="m"){
    body=`<div class="prompt">${promptHTML(q)}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  }else if(q.t==="l"){
    body=`<div class="prompt">¿Qué escuchás?</div>
      <div class="listen"><button class="play" id="say">${ICON.spk} Escuchar</button><button class="play slow" id="slow">${ICON.snail} Más lento</button></div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  }else if(q.t==="o"){
    S.toks=shuffle(q.a.split(" ").map((w,i)=>({w,i}))); S.picked=[];
    if(S.toks.map(t=>t.w).join(" ")===q.a) S.toks.reverse();
    body=`<div class="prompt">Armá la oración<span class="es">${esc(q.q)}</span></div>
      <div class="slots" id="slots" aria-label="Tu oración"></div>
      <div class="bank" id="bank">${S.toks.map((t,k)=>`<button class="tok" data-k="${k}">${esc(t.w)}</button>`).join("")}</div>
      <div class="actions"><button class="go" id="check" disabled>Comprobar</button></div>`;
  }else{
    body=`<div class="prompt">${promptHTML(q)}</div>
      <form class="write" id="wf" autocomplete="off"><input id="win" aria-label="Tu respuesta" autocapitalize="off" spellcheck="false" placeholder="Escribí acá…"><button class="go" type="submit">Comprobar</button></form>`;
  }
  app.innerHTML=`
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="Volver al pasaporte">${ICON.back}</button>
      <div class="track" aria-label="Progreso"><div style="width:${S.i/S.queue.length*100}%"></div></div>
      <div class="streak" title="Racha">${S.streak>1?"×"+S.streak:""}</div>
    </div>
    <article class="card">
      <div class="kind"><span class="label">${esc(S.meta.label)}${fromTag} · ${kinds[q.t]}${q.retry?' · <span class="retry-tag">repaso</span>':""}</span><span class="label">${Math.min(S.i+1,S.queue.length)} / ${S.queue.length}</span></div>
      ${body}
      <div id="fb"></div>
    </article>`;
  app.querySelector("#back").onclick=home;
  if(q.t==="m"||q.t==="l"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.v,b));
    if(q.t==="l"){
      const txt=q.say||q.a;
      app.querySelector("#say").onclick=()=>speak(txt);
      app.querySelector("#slow").onclick=()=>speak(txt,true);
      setTimeout(()=>speak(txt),250);
    }
  }else if(q.t==="o"){
    const slots=app.querySelector("#slots"), bank=app.querySelector("#bank"), check=app.querySelector("#check");
    const draw=()=>{
      slots.innerHTML=S.picked.map((k,pos)=>`<button class="tok" data-pos="${pos}">${esc(S.toks[k].w)}</button>`).join("");
      bank.querySelectorAll(".tok").forEach(b=>b.classList.toggle("used",S.picked.includes(+b.dataset.k)));
      slots.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ if(S.answered) return; S.picked.splice(+b.dataset.pos,1); draw(); });
      check.disabled=S.picked.length!==S.toks.length;
    };
    bank.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ if(S.answered) return; const k=+b.dataset.k; if(!S.picked.includes(k)){S.picked.push(k); draw();} });
    check.onclick=()=>answer(S.picked.map(k=>S.toks[k].w).join(" "));
    draw();
  }else{
    const inp=app.querySelector("#win");
    app.querySelector("#wf").onsubmit=e=>{e.preventDefault(); if(!S.answered && inp.value.trim()) answer(inp.value.trim());};
    setTimeout(()=>inp.focus(),50);
  }
}

function isRight(q,v){
  if(q.t==="w") return q.a.some(a=>norm(a)===norm(v));
  if(q.t==="o") return norm(v)===norm(q.a);
  return v===q.a;
}

function answer(v,btn){
  const q=S.queue[S.i]; if(S.answered) return; S.answered=true;
  const ok=isRight(q,v);
  beep(ok);
  if(!q.retry){ if(ok){S.ok++;} else {S.mistakes.push({q,v});} }
  if(ok){S.streak++; S.best=Math.max(S.best,S.streak);} else {S.streak=0; if(!q.retry) S.queue.push(Object.assign({},q,{retry:true,opts:q.opts?shuffle(q.opts):null}));}
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true; if(b.dataset.v===(q.t==="w"?q.a[0]:q.a)) b.classList.add("right");});
  if(btn && !ok) btn.classList.add("wrong");
  const inp=app.querySelector("#win"); if(inp) inp.readOnly=true;
  const correct=q.t==="w"?q.a[0]:q.a;
  const say=sentenceFor(q);
  const cheers=["Perfect!","Great!","Well done!","Excellent!","Nice!"];
  app.querySelector("#fb").innerHTML=`
    <div class="fb ${ok?"ok":"no"}" role="status">
      <div class="txt"><strong>${ok?cheers[Math.random()*cheers.length|0]:"Casi…"}</strong>
        ${ok?"":`<p>Respuesta: <b>${esc(correct)}</b></p>`}
        ${q.e?`<p>${esc(q.e)}</p>`:""}
        ${!ok&&!q.retry?`<p class="label" style="margin-top:6px">Vuelve al final para repasar</p>`:""}
      </div>
      <div class="btns">
        ${say&&TTS?`<button class="icon-btn" id="hear" aria-label="Escuchar la respuesta">${ICON.spk}</button>`:""}
        <button class="go" id="next">Seguir</button>
      </div>
    </div>`;
  const h=app.querySelector("#hear"); if(h) h.onclick=()=>speak(say);
  const n=app.querySelector("#next"); n.onclick=next; n.focus();
  app.querySelector(".streak").textContent=S.streak>1?"×"+S.streak:"";
}

function next(){ S.i++; if(S.i>=S.queue.length) result(); else ask(); }

document.addEventListener("keydown",e=>{
  if(!S||app.querySelector(".cover")||app.querySelector(".result")) return;
  if(/^[1-4]$/.test(e.key)&&!S.answered&&document.activeElement.tagName!=="INPUT"){ const b=app.querySelectorAll(".opt")[+e.key-1]; if(b) b.click(); }
});

/* ===================== Pantalla: resultado ===================== */
function result(){
  const pct=S.ok/S.total;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  let note="";
  if(S.meta.kind==="unit"){
    const prev=save.stars[S.meta.unit.n]||0;
    if(stars>prev){ save.stars[S.meta.unit.n]=stars; persist(); note=prev?"¡Nuevo récord para este File!":"¡Sello nuevo en tu pasaporte!"; }
  }
  const msgs=["Necesitás 5 bien para el sello. Repasá y probá de nuevo.","Entraste. Con 7 bien ganás la segunda estrella.","Muy bien. Con 9 bien, las tres estrellas.","Visa completa. Impecable."];
  app.style.setProperty("--c", S.meta.color);
  app.innerHTML=`
  <section class="result">
    <div class="label">${esc(S.meta.label)}${S.meta.unit?" · "+esc(S.meta.unit.t):""}</div>
    <div class="bigstamp ${stars?"":"fail"}"><span class="w">${stars?"ENTRY APPROVED":"NOT YET"}</span><span class="s">${"★".repeat(stars)+"☆".repeat(3-stars)}</span><span class="w">${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase()}</span></div>
    <div class="score">${S.ok} / ${S.total}</div>
    <p>${msgs[stars]} ${note?`<b>${note}</b>`:""}</p>
    <p>Mejor racha: ${S.best}</p>
    ${S.mistakes.length?`<div class="review"><h3>Para repasar</h3><ul>${S.mistakes.map(m=>{
      const c=m.q.t==="w"?m.q.a[0]:m.q.a;
      const prompt=m.q.t==="l"?"(escuchar)":m.q.t==="o"?m.q.q:m.q.q;
      return `<li>${esc(prompt)}<br><span class="yours">${esc(m.v)}</span> → <span class="good">${esc(c)}</span></li>`;}).join("")}</ul></div>`:""}
    <div class="row">
      <button class="go" id="again">Jugar otra vez</button>
      <button class="ghost" id="home">Volver al pasaporte</button>
    </div>
  </section>`;
  app.querySelector("#home").onclick=home;
  app.querySelector("#again").onclick=()=>{
    if(S.meta.kind==="unit") startUnit(S.meta.unit);
    else if(S.meta.kind==="mix") start(S.meta,pickMix());
    else start(S.meta,pickVerbs());
  };
}

home();

/* Modo app: guarda el juego para usarlo sin internet (solo cuando está en un sitio web propio) */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost") && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
